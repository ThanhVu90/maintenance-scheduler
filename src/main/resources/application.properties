server.address=127.0.0.1
server.port=5082
spring.datasource.url=jdbc:h2:file:./var/maintenance;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=16KB
app.planner-password=${PLANNER_PASSWORD:planner-demo-only}
app.technician-password=${TECHNICIAN_PASSWORD:technician-demo-only}
app.viewer-password=${VIEWER_PASSWORD:viewer-demo-only}
